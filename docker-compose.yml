services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: epp
      POSTGRES_PASSWORD: local-dev-only-change-me
      POSTGRES_DB: epp
    ports:
      - "5432:5432"
    volumes:
      - epp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epp -d epp"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://epp:local-dev-only-change-me@postgres:5432/epp
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  epp_pg:
