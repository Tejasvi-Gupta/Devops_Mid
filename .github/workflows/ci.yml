name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Run Ruff (backend & agent)
        run: ruff check backend agent
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - name: Terraform Format Check
        run: terraform -chdir=infrastructure/terraform fmt -check
      - name: Terraform Validate
        run: |
          terraform -chdir=infrastructure/terraform init -backend=false
          terraform -chdir=infrastructure/terraform validate

  backend:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: epp
          POSTGRES_PASSWORD: local-dev-only-change-me
          POSTGRES_DB: epp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epp -d epp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        run: python -m pip install -e "backend[dev]"
      - name: Test API
        working-directory: backend
        env:
          APP_ENV: test
          APP_SECRET_KEY: test-only-secret-key-must-be-32-chars
          DATABASE_URL: postgresql+psycopg://epp:local-dev-only-change-me@localhost:5432/epp_test
        run: python -m pytest tests -q
      - name: Test agent
        working-directory: backend
        env:
          PYTHONPATH: ../agent/src
          EPP_AGENT_MODE: test
        run: python -m pytest ../agent/tests -q --noconftest

  frontend:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm audit --audit-level=high || true
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t epp-api:ci .
